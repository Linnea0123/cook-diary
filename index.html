<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日学习打卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#fff}
body{font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;color:#000;font-weight:700;padding:10px 8px 60px;font-size:16px}
.box{max-width:760px;margin:0 auto}
input,select,textarea,button{font-family:inherit;font-weight:700;color:#000;font-size:16px}

header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;font-weight:900;letter-spacing:1px;flex:1;text-align:center}
#openAdd{border:3px solid #000;background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap}
.hleft{display:flex;gap:6px}
.iobtn{border:3px solid #000;background:#fff;border-radius:10px;padding:10px 8px;font-size:14px;font-weight:900;cursor:pointer;white-space:nowrap}

.weekbar{display:flex;align-items:stretch;gap:4px;margin-bottom:12px}
.arrow{width:34px;min-width:34px;border:3px solid #000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer;background:#fff}
.week{display:flex;gap:4px;flex:1}
.day{flex:1;border:2px solid #000;border-radius:10px;padding:7px 1px;text-align:center;cursor:pointer;background:#fff}
.day .dn{display:block;font-size:15px;font-weight:900;color:#000}
.day .dd{display:block;font-size:13px;font-weight:900;color:#000;margin-top:2px}
.day.today{border:4px solid #000}
.day.sel{background:#000}
.day.sel .dn,.day.sel .dd{color:#fff}

.nums{display:flex;justify-content:space-between;font-size:16px;font-weight:900;margin-bottom:8px}
.bar{height:18px;border:3px solid #000;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:#000}
.cheer{text-align:center;font-size:15px;font-weight:900;margin-top:8px;min-height:20px}

.sortbar{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:15px;font-weight:900}
.sortbar button{border:3px solid #000;background:#fff;border-radius:10px;padding:7px 14px;font-size:15px;font-weight:900;cursor:pointer}
.sortbar button.on{background:#000;color:#fff}
.subbar{display:none;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.subbar.show{display:flex}
.subbar button{border:3px solid #000;background:#fff;border-radius:10px;padding:7px 12px;font-size:15px;font-weight:900;cursor:pointer}
.subbar button.on{background:#000;color:#fff}
.total{font-size:15px;font-weight:900;margin-top:8px}
.over{font-size:15px;font-weight:900;white-space:nowrap}
.inp{border:3px solid #000;border-radius:8px;padding:8px;font-size:15px;font-weight:900;width:100%;background:#fff}
.fl{display:block;font-size:15px;font-weight:900;margin:10px 0 4px}
.status{font-size:14px;font-weight:900;margin-top:10px;line-height:1.6;word-break:break-all}

.row{display:flex;align-items:flex-start;gap:9px;border-bottom:3px solid #000;padding:12px 2px;cursor:pointer}
.row .main{flex:1;min-width:0}
.row .l1{display:flex;align-items:flex-start;gap:6px}
.row .l2{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.startb{border:3px solid #000;background:#fff;border-radius:8px;padding:7px 14px;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap}
.running{font-size:15px;font-weight:900}
.actual{font-size:15px;font-weight:900}
.actbtn{border:3px solid #000;background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:900;cursor:pointer;margin-left:8px}
.dtitle{font-size:19px;font-weight:900;margin-bottom:10px;line-height:1.4}
.dgrid{display:flex;flex-wrap:wrap;gap:8px}
.dgrid button{border:3px solid #000;background:#fff;border-radius:10px;min-width:66px;height:50px;font-size:17px;font-weight:900;cursor:pointer}
.dgrid button.on{background:#000;color:#fff}
.cb{width:30px;height:30px;min-width:30px;border:3px solid #000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;line-height:1;margin-top:1px}
.row.done .cb{background:#000;color:#fff}
.subj{font-size:15px;font-weight:900;white-space:nowrap;margin-top:3px}
.txt{flex:1;font-size:18px;font-weight:900;line-height:1.35}
.row.done .txt{text-decoration:line-through}
.stamp{font-size:13px;font-weight:900}
.time{font-size:20px;font-weight:900;white-space:nowrap;border-bottom:3px dashed #000;padding:2px 3px;margin-top:2px;letter-spacing:0}
.time .d{font-size:21px;font-weight:900}
.del{font-size:22px;font-weight:900;padding:0 2px 0 4px}
.empty{text-align:center;font-size:16px;padding:26px 0}
.all-done{display:none;text-align:center;font-size:20px;font-weight:900;padding:16px;margin-top:10px;border-top:3px solid #000;border-bottom:3px solid #000}
.all-done.show{display:block}

/* 预览编辑 */
.pvr{border-bottom:3px solid #000;padding:10px 2px}
.pvr .l1{display:flex;align-items:flex-start;gap:8px}
.pvr .pt{flex:1;font-size:17px;font-weight:900;line-height:1.35}
.pvr .px{font-size:20px;font-weight:900;padding:0 4px}
.pvr .l2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;font-weight:900;flex-wrap:wrap}
.pvr .pvtime{font-size:20px;font-weight:900;white-space:nowrap}
.pm{border:3px solid #000;background:#fff;border-radius:8px;min-width:48px;height:42px;font-size:17px;font-weight:900;cursor:pointer;padding:0 8px}
.pm.ok{background:#000;color:#fff}

.mask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;z-index:99;padding:10px;overflow:auto}
.mask.show{display:block}
.modal{border:4px solid #000;border-radius:14px;max-width:700px;margin:0 auto;background:#fff}
.mhead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;padding:10px 12px;font-size:19px;font-weight:900}
#mclose{font-size:24px;font-weight:900;cursor:pointer;padding:0 6px}
.mbody{padding:12px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px;font-size:16px}
.mrow label{display:flex;align-items:center;gap:5px;font-weight:900;cursor:pointer}
select{border:3px solid #000;border-radius:8px;padding:6px;font-size:16px;font-weight:900;background:#fff}
textarea{width:100%;height:160px;border:3px solid #000;border-radius:10px;padding:10px;font-size:17px;line-height:1.8;outline:none;background:#fff}
.tip{font-size:14px;font-weight:900;border:2px dashed #000;border-radius:8px;padding:8px;margin-bottom:10px;line-height:1.6}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{border:3px solid #000;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:900;cursor:pointer;background:#fff}
.btn.solid{background:#000;color:#fff}
input[type=checkbox],input[type=radio]{width:22px;height:22px}
</style>
</head>
<body>
<div class="box">
  <header>
    <div class="hleft">
      <button class="iobtn" id="btnDl">↓ 下载</button>
      <button class="iobtn" id="btnUl">↑ 上传</button>
    </div>
    <h1>每日学习打卡</h1>
    <button id="openAdd">+ 批量添加</button>
  </header>

  <div class="weekbar">
    <div class="arrow" id="prev">‹</div>
    <div class="week" id="week"></div>
    <div class="arrow" id="next">›</div>
  </div>

  <div class="nums"><span>已完成 <span id="dnum">0</span> / <span id="tnum">0</span></span><span id="pct">0%</span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="total" id="total"></div>
  <div class="cheer" id="cheer"></div>

  <div class="sortbar">
    <span>排序</span>
    <button id="sTime" class="on">按时间</button>
    <button id="sSubj">按科目</button>
  </div>
  <div class="subbar" id="subbar"></div>

  <div id="list"></div>
  <div class="all-done" id="finish">全部完成！今天超棒！</div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mhead"><span>批量添加作业</span><span id="mclose">✕</span></div>
    <div class="mbody">
      <div id="inSec">
        <div class="mrow">
          <label><input type="radio" name="mode" value="auto" checked> 自动排时间</label>
          <label><input type="radio" name="mode" value="manual"> 自己写时间</label>
        </div>
        <div class="mrow" id="autoSet">
          <span>开始</span><select id="st"></select>
          <span>每项</span>
          <select id="dur">
            <option value="15">15 分钟</option>
            <option value="20">20 分钟</option>
            <option value="25">25 分钟</option>
            <option value="30" selected>30 分钟</option>
            <option value="40">40 分钟</option>
            <option value="45">45 分钟</option>
          </select>
          <label><input type="checkbox" id="rest"> 每项后休息 5 分钟</label>
        </div>
        <div class="tip" id="tip"></div>
        <textarea id="src" placeholder="语文&#10;练字&#10;抄写第3课生字&#10;数学&#10;口算100题&#10;英语&#10;读课文第5课"></textarea>
      </div>
      <div id="pvSec" style="display:none">
        <div class="tip">点 −5 / +5 调每项时长，× 删掉这项，不合适就「全部重排」。</div>
        <div id="pvList"></div>
      </div>
      <div class="btns" id="inBtns">
        <button class="btn solid" id="gen">预 览</button>
        <button class="btn" id="mclose2">取消</button>
        <button class="btn" id="clear">清空本日</button>
      </div>
      <div class="btns" id="pvBtns" style="display:none">
        <button class="btn solid" id="confirm">确 认 生 成</button>
        <button class="btn" id="reflow">全部重排时间</button>
        <button class="btn" id="backEdit">返回修改</button>
      </div>
    </div>
  </div>
</div>
<div class="mask" id="dmask">
  <div class="modal">
    <div class="mhead"><span>实际用时</span><span id="dclose">✕</span></div>
    <div class="mbody">
      <div class="dtitle" id="dtitle"></div>
      <div class="dgrid" id="dgrid"></div>
      <div class="btns"><button class="btn" id="dskip">不记用时</button></div>
    </div>
  </div>
</div>

<div class="mask" id="smask">
  <div class="modal">
    <div class="mhead"><span>GitHub 同步</span><span id="sclose">✕</span></div>
    <div class="mbody">
      <div class="tip">用 GitHub Gist 存一份作业数据，换设备或墨水屏重装后能拉回来。Token 只存在这台设备的浏览器里，不会上传给别人。</div>
      <label class="fl">GitHub Token（勾选 gist 权限）</label>
      <input class="inp" id="tok" type="password" placeholder="ghp_xxxxxxxxxxxx">
      <label class="fl">Gist ID（首次留空，上传后自动填）</label>
      <input class="inp" id="gid" placeholder="留空则新建">
      <div class="btns">
        <button class="btn solid" id="doDl">↓ 下载到本地</button>
        <button class="btn" id="doUl">↑ 上传到云端</button>
        <button class="btn" id="sclose2">关闭</button>
      </div>
      <div class="status" id="stx"></div>
    </div>
  </div>
</div>
<script>
var cheers = ['很好，继续加油！','已经过半啦！','快完成了，坚持一下！','最后一项了！'];
var NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
var ORDER = ['语文','数学','英语','体育','其他'];
var tasks = [];
var sortBy = localStorage.getItem('sortMode') || 'time';
var filterSubj = '';

function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return iso(new Date())}
function mondayOf(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function toMin(s){var p=String(s).split(':');return (+p[0])*60+(+p[1])}
function toHm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function short(s){return s?s.charAt(0):''}
function overOf(t){
  if(!t.act)return 0;
  var d=t.act-durOf(t.time);
  return d>0?d:0;
}
function durOf(time){
  if(!time)return 0;
  var p=time.split('-');if(p.length<2)return 0;
  var m=toMin(p[1])-toMin(p[0]);
  return m<0?m+1440:m;
}

var sel = todayStr();
var weekStart = mondayOf(new Date());
function load(){tasks=JSON.parse(localStorage.getItem('homework_'+sel)||'[]')}
function save(){localStorage.setItem('homework_'+sel,JSON.stringify(tasks))}

function renderWeek(){
  var wk=document.getElementById('week');wk.innerHTML='';
  for(var i=0;i<7;i++){
    var d=new Date(weekStart);d.setDate(weekStart.getDate()+i);var s=iso(d);
    var el=document.createElement('div');
    el.className='day'+(s===sel?' sel':'')+(s===todayStr()?' today':'');
    el.innerHTML='<span class="dn">'+NAMES[i]+'</span><span class="dd">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>';
    (function(ss){el.onclick=function(){sel=ss;load();renderWeek();render()}})(s);
    wk.appendChild(el);
  }
}
document.getElementById('prev').onclick=function(){weekStart.setDate(weekStart.getDate()-7);renderWeek()};
document.getElementById('next').onclick=function(){weekStart.setDate(weekStart.getDate()+7);renderWeek()};

function sorted(){
  var a=tasks.map(function(t,i){return {t:t,i:i}});
  if(filterSubj)a=a.filter(function(o){return o.t.subj===filterSubj});
  a.sort(function(x,y){
    if(sortBy==='subj'){
      var p=ORDER.indexOf(x.t.subj),q=ORDER.indexOf(y.t.subj);
      p=p<0?99:p;q=q<0?99:q;
      if(p!==q)return p-q;
      if(x.t.subj!==y.t.subj)return x.t.subj<y.t.subj?-1:1;
    }
    var sx=x.t.time?toMin(x.t.time.split('-')[0]):9999;
    var sy=y.t.time?toMin(y.t.time.split('-')[0]):9999;
    if(sx!==sy)return sx-sy;
    return x.i-y.i;
  });
  return a;
}

function render(){
  var list=document.getElementById('list');list.innerHTML='';
  if(!tasks.length) list.innerHTML='<div class="empty">还没有任务，点右上角「+ 批量添加」</div>';
  document.getElementById('sTime').className=sortBy==='time'?'on':'';
  document.getElementById('sSubj').className=sortBy==='subj'?'on':'';
  sorted().forEach(function(o){
    var i=o.i,t=o.t;
    var row=document.createElement('div');
    row.className='row'+(t.done?' done':'');
    row.setAttribute('data-i',i);
    var sub=t.done?'【'+esc(short(t.subj))+'】':(t.subj?'【'+esc(short(t.subj))+'】':'');
    var actLine='';
    if(t.done&&t.act){
      var gap=t.time?t.act-durOf(t.time):0;
      actLine='<div class="l2"><span class="actual">实际 '+t.act+' 分钟</span>'+
        (gap>0?'<span class="over">超时 '+gap+' 分</span>':(gap<0?'<span class="actual">提前 '+(-gap)+' 分</span>':'<span class="actual">刚好</span>'))+'</div>';
    }
    row.innerHTML='<div class="cb">'+(t.done?'✓':'')+'</div>'+
      '<div class="main"><div class="l1">'+(sub?'<span class="subj">'+sub+'</span>':'')+
      '<span class="txt">'+esc(t.txt)+(t.stamp?' <span class="stamp">✓'+t.stamp+'</span>':'')+'</span></div>'+actLine+'</div>'+
      '<span class="time" data-i="'+i+'">'+(t.time?'<span class="d">【'+durOf(t.time)+'分】</span>'+t.time:'设时间')+'</span>'+
      '<span class="del" data-i="'+i+'">×</span>';
    list.appendChild(row);
  });
  renderSubbar();
  var tm=0,am=0,om=0,dn=0;
  tasks.forEach(function(x){
    var m=durOf(x.time);tm+=m;
    if(x.done){dn++;am+=(x.act||m);om+=overOf(x)}
  });
  document.getElementById('total').textContent='计划 '+tm+' 分钟'+(dn?' · 实际 '+am+' 分钟':'')+(om?' · 超时 '+om+' 分钟':'');
  var d=tasks.filter(function(x){return x.done}).length;
  var p=tasks.length?Math.round(d/tasks.length*100):0;
  document.getElementById('dnum').textContent=d;
  document.getElementById('tnum').textContent=tasks.length;
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('finish').className='all-done'+(tasks.length&&d===tasks.length?' show':'');
  document.getElementById('cheer').textContent=tasks.length===0?'':(d===tasks.length?'全部搞定，去玩吧！':cheers[Math.min(Math.floor(d/tasks.length*4),3)]);
}

document.getElementById('list').onclick=function(e){
  var el=e.target;
  if(el.classList.contains('del')){tasks.splice(+el.getAttribute('data-i'),1);save();render();return}
  var tm=el.closest('.time');
  if(tm){openExisting();return}
  var row=el.closest('.row');
  if(!row)return;
  var idx=+row.getAttribute('data-i');
  if(tasks[idx].done){
    tasks[idx].done=false;tasks[idx].stamp='';tasks[idx].act=0;tasks[idx].over=0;save();render();
  }else{
    tasks[idx].done=true;tasks[idx].stamp=nowHM();save();render();
    askDuration(idx);
  }
};

/* ---- 实际用时选择 ---- */
var DURS=[5,10,15,20,25,30,35,40,45,50,55,60,70,80,90,120];
var pendIdx=-1;
function askDuration(i){
  pendIdx=i;
  var t=tasks[i];
  document.getElementById('dtitle').textContent=(t.subj?'【'+t.subj+'】':'')+t.txt+'　计划 '+durOf(t.time)+' 分钟，实际用了？';
  var g=document.getElementById('dgrid');g.innerHTML='';
  DURS.forEach(function(d){
    var b=document.createElement('button');
    b.textContent=d+' 分';
    if(d===durOf(t.time))b.className='on';
    b.onclick=function(){setAct(d)};
    g.appendChild(b);
  });
  document.getElementById('dmask').className='mask show';
}
function setAct(d){
  if(pendIdx>=0&&tasks[pendIdx]){
    tasks[pendIdx].act=d;
    tasks[pendIdx].over=overOf(tasks[pendIdx]);
    save();
  }
  pendIdx=-1;
  document.getElementById('dmask').className='mask';
  render();
}
document.getElementById('dclose').onclick=function(){pendIdx=-1;document.getElementById('dmask').className='mask';render()};
document.getElementById('dskip').onclick=function(){pendIdx=-1;document.getElementById('dmask').className='mask';render()};

function renderSubbar(){
  var bar=document.getElementById('subbar');
  bar.className='subbar'+(sortBy==='subj'?' show':'');
  bar.innerHTML='';
  if(sortBy!=='subj')return;
  var used=[];
  tasks.forEach(function(t){if(t.subj&&used.indexOf(t.subj)<0)used.push(t.subj)});
  var all=ORDER.slice();
  used.forEach(function(s){if(all.indexOf(s)<0)all.push(s)});
  var opts=[''].concat(all);
  opts.forEach(function(s){
    var b=document.createElement('button');
    b.textContent=s||'全部';
    if(filterSubj===s)b.className='on';
    b.onclick=function(){filterSubj=s;render()};
    bar.appendChild(b);
  });
}

var KNOWN=ORDER.concat(['科学','道法','美术','音乐','书法','历史','地理','生物','物理','化学','信息','政治']);
function parseBlock(text){
  var out=[],cur='';
  text.split('\n').forEach(function(line){
    var t=line.trim();
    if(!t||t.charAt(0)==='#')return;
    var time='';
    var m=t.match(/(\d{1,2}\s*[:：]\s*\d{2})\s*[-–~—至到]\s*(\d{1,2}\s*[:：]\s*\d{2})/);
    if(m){time=m[1].replace(/\s/g,'').replace('：',':')+'-'+m[2].replace(/\s/g,'').replace('：',':');t=t.replace(m[0],' ').trim()}
    var parts=t.split(/[\s,，、;；:：]+/).filter(Boolean);
    if(!parts.length)return;
    if(parts.length===1&&!time&&(KNOWN.indexOf(parts[0])>=0||/[:：]$/.test(t))){cur=parts[0].replace(/[:：]$/,'');return}
    var subj=cur;
    if(parts.length>1&&KNOWN.indexOf(parts[0])>=0){subj=parts[0];parts=parts.slice(1);cur=subj}
    else if(parts.length>1&&!cur){subj=parts[0];parts=parts.slice(1)}
    out.push({subj:subj,txt:parts.join(' '),time:time,done:false,stamp:''});
  });
  return out;
}

var mask=document.getElementById('mask');
function openMask(){mask.className='mask show'}
function closeMask(){mask.className='mask'}
document.getElementById('openAdd').onclick=function(){editingExisting=false;showInput();openMask()};
document.getElementById('mclose').onclick=closeMask;
document.getElementById('mclose2').onclick=closeMask;

var stSel=document.getElementById('st');
for(var h=16;h<=21;h++){for(var mm=0;mm<60;mm+=10){
  var v=pad(h)+':'+pad(mm);var op=document.createElement('option');
  op.value=v;op.text=v;if(v==='19:00')op.selected=true;stSel.appendChild(op);
}}

var radios=document.getElementsByName('mode');
function syncTip(){
  var auto=radios[0].checked;
  document.getElementById('autoSet').style.display=auto?'flex':'none';
  document.getElementById('tip').textContent=auto
    ? '每行一项，不用打时间。单独一行写「语文」，下面几行就都算语文，再空一行写「数学」可换科目。时间按开始时间自动排。'
    : '每行一项，自己写时间：语文 练字 19:00-19:30';
}
radios[0].onchange=syncTip;radios[1].onchange=syncTip;syncTip();

document.getElementById('gen').onclick=function(){
  var auto=radios[0].checked;
  var start=toMin(stSel.value||'19:00');
  var dur=parseInt(document.getElementById('dur').value,10);
  var gap=dur+(document.getElementById('rest').checked?5:0);
  var items=parseBlock(document.getElementById('src').value);
  if(!items.length){alert('没识别到任务，检查一下格式～');return}
  items.forEach(function(o){
    if(auto&&!o.time){o.time=toHm(start)+'-'+toHm(start+dur);start+=gap}
  });
  draft=items;editingExisting=false;showPreview();
};

/* ---- 预览编辑 ---- */
var draft=[],editingExisting=false;
function $(id){return document.getElementById(id)}
function showInput(){
  $('inSec').style.display='';$('inBtns').style.display='flex';
  $('pvSec').style.display='none';$('pvBtns').style.display='none';
  document.querySelector('.mhead span').textContent='批量添加作业';
}
function showPreview(){
  $('inSec').style.display='none';$('inBtns').style.display='none';
  $('pvSec').style.display='';$('pvBtns').style.display='flex';
  document.querySelector('.mhead span').textContent=editingExisting?'调整时间（改完点确认）':'预览确认';
  drawPv();
}
function drawPv(){
  var box=$('pvList');box.innerHTML='';
  if(!draft.length)box.innerHTML='<div class="empty">没有任务了，点「返回修改」重新输入</div>';
  draft.forEach(function(o,i){
    var d=document.createElement('div');
    d.className='pvr';
    d.innerHTML='<div class="l1">'+
      (o.subj?'<span class="subj">【'+esc(o.subj)+'】</span>':'')+
      '<span class="pt">'+esc(o.txt)+'</span>'+
      '<span class="px" data-del="'+i+'">×</span></div>'+
      '<div class="l2"><span class="pvtime">'+(o.time?'【'+durOf(o.time)+'分】'+o.time:'无时间')+'</span>'+
      '<button class="pm" data-s="'+i+'" data-v="-5">起−5</button>'+
      '<button class="pm" data-s="'+i+'" data-v="5">起+5</button>'+
      '<button class="pm" data-e="'+i+'" data-v="-5">止−5</button>'+
      '<button class="pm" data-e="'+i+'" data-v="5">止+5</button>'+
      (o.done?'<span>已完成</span>':'')+'</div>';
    box.appendChild(d);
  });
}
$('pvList').onclick=function(e){
  var t=e.target,i,v,p;
  if(t.getAttribute('data-del')){draft.splice(+t.getAttribute('data-del'),1);drawPv();return}
  if((v=t.getAttribute('data-s'))){i=+v;p=draft[i].time?draft[i].time.split('-'):['19:00','19:30'];
    var a=toMin(p[0])+ +t.getAttribute('data-v'),b=toMin(p[1]);
    if(b<=a)b=a+5;draft[i].time=toHm(a)+'-'+toHm(b);drawPv();return}
  if((v=t.getAttribute('data-e'))){i=+v;p=draft[i].time?draft[i].time.split('-'):['19:00','19:30'];
    var a2=toMin(p[0]),b2=toMin(p[1])+ +t.getAttribute('data-v');
    if(b2<=a2)b2=a2+5;draft[i].time=toHm(a2)+'-'+toHm(b2);drawPv();return}
};
$('reflow').onclick=function(){
  var start=toMin(stSel.value||'19:00');
  var rest=document.getElementById('rest').checked?5:0;
  draft.forEach(function(o){
    var len=o.time?toMin(o.time.split('-')[1])-toMin(o.time.split('-')[0]):parseInt(document.getElementById('dur').value,10);
    if(len<5)len=5;
    o.time=toHm(start)+'-'+toHm(start+len);
    start+=len+rest;
  });
  drawPv();
};
$('backEdit').onclick=function(){
  if(editingExisting){closeMask();return}
  showInput();
};
$('confirm').onclick=function(){
  if(editingExisting){tasks=draft}
  else{
    draft.forEach(function(o){tasks.push(o)});
    document.getElementById('src').value='';
  }
  draft=[];editingExisting=false;
  save();render();closeMask();showInput();
};
function openExisting(){
  if(!tasks.length)return;
  draft=tasks.map(function(t){return {subj:t.subj,txt:t.txt,time:t.time,done:t.done,stamp:t.stamp,act:t.act||0,over:t.over||0}});
  editingExisting=true;openMask();showPreview();
}

document.getElementById('clear').onclick=function(){
  if(confirm('清空 '+sel+' 这一天的全部任务？')){tasks=[];save();render();closeMask()}
};
document.getElementById('sTime').onclick=function(){sortBy='time';filterSubj='';localStorage.setItem('sortMode',sortBy);render()};
document.getElementById('sSubj').onclick=function(){sortBy='subj';localStorage.setItem('sortMode',sortBy);render()};

/* ---- GitHub Gist 同步 ---- */
function $(id){return document.getElementById(id)}
var smask=$('smask');
function openSync(){
  $('tok').value=localStorage.getItem('gh_token')||'';
  $('gid').value=localStorage.getItem('gist_id')||'';
  smask.className='mask show';
}
function closeSync(){smask.className='mask'}
$('btnDl').onclick=function(){openSync();if(localStorage.getItem('gh_token'))doDownload();else sts('先填 Token；首次下载还要填另一台设备上传得到的 Gist ID。')};
$('btnUl').onclick=function(){openSync();if(localStorage.getItem('gh_token'))doUpload();else sts('先填 Token（GitHub → Settings → Developer settings → Personal access tokens，勾选 gist）')};
$('sclose').onclick=closeSync;$('sclose2').onclick=closeSync;
$('doDl').onclick=function(){saveCred();doDownload()};
$('doUl').onclick=function(){saveCred();doUpload()};
function saveCred(){
  localStorage.setItem('gh_token',$('tok').value.trim());
  localStorage.setItem('gist_id',$('gid').value.trim());
}
function sts(m){$('stx').textContent=m}
function collect(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('homework_')===0)o[k]=JSON.parse(localStorage.getItem(k));
  }
  return o;
}
function req(method,url,body,cb){
  var x=new XMLHttpRequest();
  x.open(method,url,true);
  x.setRequestHeader('Accept','application/vnd.github+json');
  x.setRequestHeader('Content-Type','application/json');
  if(localStorage.getItem('gh_token'))x.setRequestHeader('Authorization','token '+localStorage.getItem('gh_token'));
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var d=null;try{d=JSON.parse(x.responseText)}catch(e){}
    if(x.status>=200&&x.status<300)cb(null,d);
    else cb('HTTP '+x.status+' '+(d&&d.message?d.message:x.responseText.slice(0,80)),d);
  };
  x.send(body?JSON.stringify(body):null);
}
function doUpload(){
  sts('上传中…');
  var content=JSON.stringify(collect());
  var id=localStorage.getItem('gist_id');
  var files={'homework.json':{content:content}};
  if(id){
    req('PATCH','https://api.github.com/gists/'+id,{files:files},function(err,d){
      if(err)return sts('上传失败：'+err);
      sts('已上传 ✔  Gist ID：'+(d&&d.id?id:id));
    });
  }else{
    req('POST','https://api.github.com/gists',{description:'每日学习打卡数据',public:false,files:files},function(err,d){
      if(err)return sts('上传失败：'+err);
      localStorage.setItem('gist_id',d.id);$('gid').value=d.id;
      sts('已新建并上传 ✔  Gist ID：'+d.id+'（记下来，另一台设备填它）');
    });
  }
}
function doDownload(){
  var id=localStorage.getItem('gist_id');
  if(!id)return sts('没有 Gist ID：先在已录入作业的设备上点「上传」，把生成的 ID 填到这里。');
  sts('下载中…');
  req('GET','https://api.github.com/gists/'+id,null,function(err,d){
    if(err)return sts('下载失败：'+err);
    var f=d&&d.files&&d.files['homework.json'];
    if(!f)return sts('云端没有 homework.json');
    var o=null;try{o=JSON.parse(f.content)}catch(e){return sts('数据解析失败')}
    var n=0;
    for(var k in o){if(k.indexOf('homework_')===0){localStorage.setItem(k,JSON.stringify(o[k]));n++}}
    load();renderWeek();render();
    sts('已下载 ✔ 合并 '+n+' 天的数据到本机');
  });
}

load();renderWeek();render();
